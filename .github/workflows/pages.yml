# Builds the web app and publishes it to GitHub Pages on every push to main.
#
# Repository settings needed once:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables:
#     API_BASE = https://<your-static-domain>.ngrok-free.app   (the backend tunnel)
#     BASE_PATH / SITE_URL = only for a custom domain, e.g. / and https://cityshield.live/
# Without API_BASE the site still works, in offline demo mode.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          # Default: https://<owner>.github.io/<repo>/. With a custom domain set the
          # repo variables BASE_PATH=/ and SITE_URL=https://cityshield.live/
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_RELEASE: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
