<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Shield · Safer Cities. Stronger Communities.</title>
<meta name="description" content="City Shield — one-tap emergency help and civic complaints for Bengaluru. Interactive prototype.">
<meta name="theme-color" content="#0A1A3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Caveat:wght@600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy-950:#061029;--navy-900:#0A1A3F;--navy-850:#0D1F4A;--navy-800:#112659;--navy-700:#1A3572;
  --blue:#1F5BE0;--blue-600:#1848B8;--blue-soft:#E9F0FE;
  --red:#E5383B;--red-deep:#B3131B;--red-soft:#FDECEC;
  --green:#149452;--green-soft:#E4F5EA;
  --amber:#C27A00;--amber-soft:#FFF3D6;
  --c-police:#2F5BD3;--c-police-soft:#E8EEFC;
  --c-amb:#E5383B;--c-amb-soft:#FDECEC;
  --c-fire:#EA4A24;--c-fire-soft:#FEEDE7;
  --c-civic:#149452;--c-civic-soft:#E4F5EA;
  --bg:#F1F4F9;--surface:#FFFFFF;--surface-2:#F6F8FC;--text:#0F1C36;--text-2:#56647E;--text-3:#8793A8;--border:#E2E7EF;
  --shadow:0 1px 2px rgba(15,28,54,.05),0 6px 18px rgba(15,28,54,.06);
  --map-land:#ECF0F4;--map-block:#DFE5EC;--map-road:#FFFFFF;--map-casing:#D3DAE4;--map-park:#CBEAD3;--map-tree:#B3DDBF;--map-water:#BBDCF5;--map-label:#6F7D93;--map-halo:#ECF0F4;
  --font:'Plus Jakarta Sans','Noto Sans Kannada','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08132E;--surface:#101C3C;--surface-2:#152348;--text:#E9EFFA;--text-2:#A7B4CC;--text-3:#7A89A6;--border:#1F2F57;
    --blue:#4F82F5;--blue-soft:#172C5E;--red-soft:#3B1621;--green:#2FBF74;--green-soft:#0F3328;--amber:#E6A537;--amber-soft:#3A2B0E;
    --c-police:#6A8FF0;--c-police-soft:#1A2B5C;--c-amb:#F2575A;--c-amb-soft:#3B1621;--c-fire:#F26A45;--c-fire-soft:#3D1D14;--c-civic:#2FBF74;--c-civic-soft:#0F3328;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --map-land:#132142;--map-block:#1A2A50;--map-road:#2B3C66;--map-casing:#0D1834;--map-park:#15392F;--map-tree:#1C4A3B;--map-water:#163A63;--map-label:#8C9AB8;--map-halo:#132142;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08132E;--surface:#101C3C;--surface-2:#152348;--text:#E9EFFA;--text-2:#A7B4CC;--text-3:#7A89A6;--border:#1F2F57;
  --blue:#4F82F5;--blue-soft:#172C5E;--red-soft:#3B1621;--green:#2FBF74;--green-soft:#0F3328;--amber:#E6A537;--amber-soft:#3A2B0E;
  --c-police:#6A8FF0;--c-police-soft:#1A2B5C;--c-amb:#F2575A;--c-amb-soft:#3B1621;--c-fire:#F26A45;--c-fire-soft:#3D1D14;--c-civic:#2FBF74;--c-civic-soft:#0F3328;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --map-land:#132142;--map-block:#1A2A50;--map-road:#2B3C66;--map-casing:#0D1834;--map-park:#15392F;--map-tree:#1C4A3B;--map-water:#163A63;--map-label:#8C9AB8;--map-halo:#132142;
  color-scheme:dark;
}
html{height:100%;background:var(--navy-900);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--navy-900);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:28px;height:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
#app{height:100%;display:flex}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
.topbar{display:none}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.view.has-nav{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.view.v-navy{background:var(--navy-900)}
.view.v-sos{background:#0A1330}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--text-3);border-radius:12px}
.bnav button.on{color:var(--blue)}
.bnav.dark{background:#0B1734;border-top-color:rgba(255,255,255,.07)}
.bnav.dark button{color:rgba(255,255,255,.5)}
.bnav.dark button.on{color:#fff}
.bnav .ic{width:22px;height:22px}

/* ---------- page header (mobile) ---------- */
.phead{position:sticky;top:0;z-index:20;background:var(--navy-900);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:64px}
.phead .back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin-left:-4px;flex:none}
.phead .back:hover{background:rgba(255,255,255,.08)}
.phead .tt{min-width:0}
.phead h1{font-size:17px;font-weight:700;line-height:1.25}
.phead p{font-size:12.5px;color:rgba(255,255,255,.68);margin-top:1px}
.phead .act{margin-left:auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none;position:relative}

/* ---------- common ---------- */
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.sec-h h2{font-size:15.5px;font-weight:700}
.link{color:var(--blue);font-weight:700;font-size:13px;padding:4px 2px}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;line-height:1.3}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--border)}
button.row:hover,.hov:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14px;line-height:1.3}
.row .s{font-size:12.5px;color:var(--text-2);margin-top:2px}
.row .chev{color:var(--text-3)}
.ib{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.ib.round{border-radius:50%}
.t-police{background:var(--c-police-soft);color:var(--c-police)}
.t-ambulance{background:var(--c-amb-soft);color:var(--c-amb)}
.t-fire{background:var(--c-fire-soft);color:var(--c-fire)}
.t-civic{background:var(--c-civic-soft);color:var(--c-civic)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.s-police{background:var(--c-police);color:#fff}
.s-ambulance{background:var(--c-amb);color:#fff}
.s-fire{background:var(--c-fire);color:#fff}
.s-civic{background:var(--c-civic);color:#fff}
.s-amber{background:#E8870B;color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;width:100%;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.primary{background:var(--blue);color:#fff}
.btn.navy{background:var(--navy-900);color:#fff}
.btn.outline{border:1.5px solid var(--blue);color:var(--blue);background:var(--surface)}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn:hover{filter:brightness(1.04)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sw{width:46px;height:28px;border-radius:999px;background:#C3CCDA;position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--blue)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.okc{display:flex;gap:12px;align-items:center;padding:14px;background:var(--green-soft);border-radius:16px;border:1px solid rgba(20,148,82,.18)}
.okc .dot{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.okc b{display:block;font-size:14px;color:var(--green)}
.okc span{font-size:12.5px;color:var(--text-2)}
.demo-tag{font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.01em}

/* ---------- home (mobile) ---------- */
.hero{position:relative;height:min(60vh,470px);min-height:360px;overflow:hidden;color:#fff}
.hero-art,.hero-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,41,.5) 0%,rgba(6,16,41,0) 30%,rgba(10,26,63,0) 58%,rgba(10,26,63,.85) 84%,var(--navy-900) 100%)}
.hero-brand{position:absolute;top:22px;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-row svg{width:40px;height:46px}
.brand-name{font-size:25px;font-weight:800;letter-spacing:.03em;line-height:1}
.brand-tag{font-size:11.5px;color:rgba(255,255,255,.82);margin-top:6px;font-weight:500}
.hero-bell{position:absolute;top:18px;right:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(6,16,41,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14)}
.badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--navy-900)}
.hero-greet{position:absolute;left:20px;right:20px;bottom:14px}
.hero-greet .g1{font-size:14px;color:rgba(255,255,255,.85);font-weight:500}
.hero-greet h1{font-size:26px;font-weight:800;line-height:1.15;margin-top:2px}
.hero-greet .loc{display:flex;align-items:center;gap:5px;font-size:13px;color:rgba(255,255,255,.8);margin-top:6px}
.home-body{padding:6px 14px 18px;display:flex;flex-direction:column;gap:12px;background:var(--navy-900)}
.onetap{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left}
.onetap .sq{width:52px;height:52px;border-radius:15px;background:linear-gradient(160deg,#FF5757,#D81F26);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(229,56,59,.35)}
.onetap .t{font-size:16.5px;font-weight:800}
.onetap .s{font-size:12.5px;color:var(--text-2);margin-top:3px}
.svc4{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 6px}
.svc4 button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:6px 2px;border-radius:14px}
.svc4 button:hover{background:var(--surface-2)}
.svc4 .ib{width:54px;height:54px;border-radius:50%}
.svc4 .ib .ic{width:24px;height:24px}

/* ---------- SOS ---------- */
.sos-page{min-height:100%;color:#fff;padding:26px 18px 22px;background:radial-gradient(circle at 50% 30%,rgba(229,56,59,.33),rgba(229,56,59,0) 44%),linear-gradient(180deg,#0C1839,#0A1330);display:flex;flex-direction:column;align-items:center}
.sos-page h1{font-size:23px;font-weight:800;text-align:center}
.sos-page .sub{font-size:13.5px;color:rgba(255,255,255,.72);margin-top:4px;text-align:center}
.sos-wrap{position:relative;width:250px;height:250px;display:grid;place-items:center;margin:26px 0 22px}
.sos-ring{position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(255,90,90,.45);animation:ring 2.4s ease-out infinite}
.sos-ring.r2{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.22);opacity:0}}
.sos-btn{position:relative;width:196px;height:196px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FF6464,#EA2A2F 55%,#B3131B);box-shadow:0 0 0 12px rgba(229,56,59,.2),0 0 0 26px rgba(229,56,59,.08),0 20px 60px rgba(229,56,59,.55),inset 0 -8px 20px rgba(120,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;transition:transform .12s}
.sos-btn:active{transform:scale(.96)}
.sos-btn .ic{width:36px;height:36px;stroke-width:2.2}
.sos-btn b{font-size:36px;font-weight:800;letter-spacing:.04em;line-height:1}
.sos-svc{display:flex;justify-content:center;gap:26px;margin-bottom:24px}
.sos-svc button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#fff}
.sos-svc .c{width:66px;height:66px;border-radius:50%;background:#15244C;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;transition:background .15s}
.sos-svc button:hover .c{background:#1C2F60}
.sos-svc .ic{width:26px;height:26px}
.dcard{width:100%;max-width:480px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;color:#fff}
.dcard + .dcard{margin-top:12px}
.dcard .t{font-size:13.5px;font-weight:700}
.dcard .s{font-size:12.5px;color:rgba(255,255,255,.66);margin-top:2px}
.dcard .ib{background:rgba(255,255,255,.08);color:#fff;width:40px;height:40px}
.dcard .sw{background:rgba(255,255,255,.22)}
.dcard .sw[aria-checked="true"]{background:#3F7BFF}
.dcard .grow{flex:1;min-width:0}

/* ---------- map ---------- */
.map{position:relative;overflow:hidden;background:var(--map-land);height:260px}
.map svg{display:block;width:100%;height:100%}
.map-live{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--text);font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;box-shadow:var(--shadow)}
.map-live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.map-sim{position:absolute;right:8px;bottom:6px;font-size:10px;font-weight:600;color:var(--text-3);background:var(--surface);opacity:.85;padding:2px 7px;border-radius:6px}
.map-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.map-zoom button{width:36px;height:36px;display:grid;place-items:center;color:var(--text-2)}
.map-zoom button + button{border-top:1px solid var(--border)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}

/* ---------- service ---------- */
.svc-body{padding:14px 16px 26px;display:flex;flex-direction:column;gap:14px}
.eta{display:flex;align-items:center;padding:14px 12px 14px 16px;width:100%;text-align:left}
.eta .col{flex:1;min-width:0}
.eta .col + .col{border-left:1px solid var(--border);padding-left:16px}
.eta .lb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:600}
.eta .v{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:-.01em}
.eta .v.done{color:var(--green)}
.eta .chev{color:var(--text-3);margin-left:6px}
.hosp .row{cursor:pointer}
.hosp .row.sel{background:var(--blue-soft)}
.hosp .row.sel .t{color:var(--blue)}
.officer{display:flex;align-items:center;gap:13px;padding:14px}
.officer .av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:#DCE6F7}
.officer .av svg{width:100%;height:100%;display:block}
.officer .n{font-size:15.5px;font-weight:800}
.officer .s{font-size:12.5px;color:var(--text-2);margin-top:1px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--blue);text-align:center;box-shadow:var(--shadow)}
.act-btn:hover{background:var(--blue-soft)}
.feed{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#333}
.feed svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.feed::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.rec{position:absolute;top:10px;right:10px;background:rgba(200,20,20,.9);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;z-index:2}
.rec i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.feed-meta{position:absolute;left:10px;bottom:8px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);font-variant-numeric:tabular-nums;z-index:2}

/* ---------- complaints ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:15px 6px 13px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:border-color .15s}
.cat:hover{border-color:var(--blue)}
.cat .ib{width:46px;height:46px;border-radius:50%}
.cat .t{font-size:13px;font-weight:700;line-height:1.2}
.cat .s{font-size:11px;color:var(--text-2);margin-top:-3px}
.cmp .row .t{font-size:13.5px}
.cmp .row .meta{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:4px}
.cmp .row .time{font-size:11.5px;color:var(--text-3)}
.cmp .row.sel{background:var(--blue-soft)}
.photo{border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#555;position:relative}
.photo svg,.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kv{display:flex;gap:10px;align-items:flex-start}
.kv .ic{color:var(--text-3);margin-top:1px}
.kv .k{font-size:12px;color:var(--text-2);font-weight:600}
.kv .v{font-size:14px;font-weight:700;margin-top:1px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:'';position:absolute;left:8px;top:18px;bottom:-2px;width:2px;background:var(--border)}
.tl li.done::before{background:var(--blue)}
.tl li:last-child::before{display:none}
.tl .d{position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center}
.tl li.done .d{background:var(--blue);border-color:var(--blue);color:#fff}
.tl li.cur .d{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.tl li.cur .d::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl .t{font-size:14px;font-weight:700}
.tl .s{font-size:12px;color:var(--text-2);margin-top:1px}
.tl li.todo .t{color:var(--text-3)}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lbl{font-size:13px;font-weight:700}
.inp{width:100%;border:1.5px solid var(--border);background:var(--surface);border-radius:13px;padding:12px 14px;font-size:14.5px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--blue)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap;color:var(--text-2)}
.pill.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.pill.navy.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.drop{border:2px dashed var(--border);border-radius:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:600;background:var(--surface);position:relative;overflow:hidden;width:100%}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .rm{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;z-index:2}

/* ---------- lists / settings ---------- */
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-3);display:grid;place-items:center;flex:none}
.radio.on{border-color:var(--blue);background:var(--blue)}
.radio.on::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
.lang .row.on{background:var(--blue-soft)}
.lang .row .t{font-weight:600}
.prof{display:flex;align-items:center;gap:14px;padding:18px 16px}
.prof .av{width:64px;height:64px;border-radius:50%;background:var(--navy-800);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.prof .n{font-size:18px;font-weight:800}
.prof .s{font-size:13px;color:var(--text-2);margin-top:2px}
.prof .edit{margin-left:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2)}
.prof .edit:hover{background:var(--surface-2)}
.menu .row .ic{color:var(--text-2)}
.seg{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.ntf .row{align-items:flex-start}
.ntf .row .when{font-size:11.5px;color:var(--text-3);white-space:nowrap;margin-left:8px}
.ntf .row.unread .t::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-left:7px;vertical-align:middle}
.empty{padding:36px 20px;text-align:center;color:var(--text-2)}
.empty .ib{margin:0 auto 12px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,13,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);color:var(--text);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88%;overflow:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 12px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sheet .sh h3{font-size:17px;font-weight:800}
.sheet .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.sheet .map{height:320px;border-radius:16px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ov{position:fixed;inset:0;z-index:80;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;animation:fade .2s ease;background:radial-gradient(circle at 50% 40%,rgba(229,56,59,.3),rgba(229,56,59,0) 50%),#081231}
.ov.calm{background:linear-gradient(180deg,#0E2150,#081231)}
.ov h2{font-size:24px;font-weight:800;margin-top:18px}
.ov p{color:rgba(255,255,255,.75);font-size:14px;max-width:340px;margin-top:6px}
.cd{position:relative;width:180px;height:180px}
.cd svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd b{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800}
.ov .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:26px}
.ov .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.16)}
.ov .okbig{width:88px;height:88px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(20,148,82,.2)}
.ov .okbig .ic{width:44px;height:44px;stroke-width:2.6;color:#fff}
.dispatch{width:100%;max-width:360px;margin-top:22px;display:flex;flex-direction:column;gap:10px}
.dispatch .dcard{max-width:none}
.dispatch .dcard + .dcard{margin-top:0}
.call-av{width:112px;height:112px;border-radius:50%;overflow:hidden;background:#DCE6F7;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 0 0 22px rgba(255,255,255,.03)}
.call-av svg{width:100%;height:100%}
.call-av .ic{width:48px;height:48px;color:var(--navy-900)}
.call-ctl{display:flex;gap:22px;margin-top:40px}
.call-ctl button{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.call-ctl button.on{background:#fff;color:var(--navy-900)}
.call-ctl button.end{background:var(--red)}
.call-ctl .ic{width:24px;height:24px}
.vid{position:fixed;inset:0;z-index:80;background:#0B1026;display:flex;flex-direction:column;animation:fade .2s}
.vid-main{flex:1;position:relative;overflow:hidden}
.vid-main svg{position:absolute;inset:0;width:100%;height:100%}
.vid-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#fff;z-index:2}
.vid-top b{font-size:16px}
.vid-top span{font-size:12.5px;opacity:.8;display:block}
.vid-self{position:absolute;right:16px;bottom:120px;width:104px;height:140px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.3);background:linear-gradient(160deg,#35507F,#1C2B4F);display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;z-index:2}
.vid .call-ctl{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));justify-content:center;margin:0;z-index:2;color:#fff}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 28px);max-width:420px}
.toast{background:#0F1C36;color:#fff;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease;width:100%}
.toast .ib{width:30px;height:30px;border-radius:50%}
.toast .ic{width:16px;height:16px}

/* ---------- track hub / misc ---------- */
.trk .row .v{font-weight:800;font-size:14px;text-align:right}
.trk .row .v small{display:block;font-size:11.5px;font-weight:600;color:var(--text-3)}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:7px;border:1px solid var(--border)}
.bar i{display:block;height:100%;border-radius:9px}
.help-num{font-size:18px;font-weight:800;min-width:48px;color:var(--blue)}
details.faq{border-top:1px solid var(--border)}
details.faq:first-child{border-top:0}
details.faq summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq[open] summary .ic{transform:rotate(90deg)}
details.faq p{padding:0 14px 14px;color:var(--text-2);font-size:13.5px}
.steps{display:grid;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.step b{font-size:14px}
.step p{font-size:13px;color:var(--text-2);margin-top:1px}

/* ---------- desktop ---------- */
@media (min-width:960px){
  body{background:var(--bg)}
  html{background:var(--bg)}
  .sidebar{display:flex;flex-direction:column;width:264px;flex:none;background:var(--navy-900);color:#fff;height:100%;overflow-y:auto;padding:22px 14px 18px}
  .main{max-width:none;margin:0}
  .topbar{display:flex;align-items:center;gap:16px;height:74px;flex:none;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border)}
  .bnav{display:none}
  .view.has-nav{padding-bottom:0}
  .view.v-navy,.view.v-sos{background:var(--bg)}
  .toasts{left:auto;right:28px;transform:none;bottom:28px;align-items:flex-end}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:24px;max-width:540px;max-height:86vh;padding-bottom:22px}
  .sheet .grab{display:none}
  .sheet.wide{max-width:880px}
  .sheet.wide .map{height:520px}
  .map{height:auto}
}

.sb-sos small{display:block;font-weight:600;font-size:11.5px;opacity:.85}
.sb-grp{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.42);padding:14px 12px 6px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:rgba(255,255,255,.72);font-weight:600;font-size:14px;width:100%;position:relative}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:rgba(255,255,255,.11);color:#fff}
.nav-i.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#5B8CFF}
.nav-i .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}
.nav-i .dot{width:9px;height:9px;border-radius:50%;margin-left:4px}
.sb-foot{margin-top:auto;padding-top:18px}
.sb-112{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);width:100%;text-align:left}
.sb-112 b{font-size:20px;font-weight:800}
.sb-112 span{font-size:11.5px;color:rgba(255,255,255,.66);display:block;line-height:1.35}
.sb-tag{font-family:'Caveat',cursive;font-size:21px;color:rgba(255,255,255,.72);text-align:center;margin-top:14px;line-height:1.1}
.tb-back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);color:var(--text-2);flex:none}
.tb-back:hover{background:var(--surface-2)}
.tb-t h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tb-t p{font-size:13px;color:var(--text-2);margin-top:1px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-loc{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-2)}
.tb-loc .ic{color:var(--blue)}
.tb-ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);color:var(--text-2);position:relative}
.tb-ib:hover{background:var(--surface-2)}
.tb-ib .badge{border-color:var(--surface);top:4px;right:4px}
.tb-me{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:14px;border:1px solid var(--border)}
.tb-me:hover{background:var(--surface-2)}
.tb-me i{width:34px;height:34px;border-radius:10px;background:var(--navy-800);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.tb-me b{font-size:13px;display:block;line-height:1.2}
.tb-me span{font-size:11.5px;color:var(--text-3)}
.dpage{padding:26px 32px 44px;max-width:1360px;margin:0 auto}
.dcols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:24px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:20px;min-width:0}

.dhero-art svg{width:100%;height:100%;display:block}
.dhero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--navy-900) 36%,rgba(10,26,63,.55) 58%,rgba(10,26,63,0) 78%);pointer-events:none}
.dhero-in{position:relative;z-index:1;padding:34px 38px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.dhero-in .g1{font-size:15px;color:rgba(255,255,255,.75);font-weight:500}
.dhero-in h1{font-size:36px;font-weight:800;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
.dhero-in .loc{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);margin-top:10px;font-size:14px}

.dhero-cta .btn{width:auto;min-height:52px;padding:0 22px}
.btn.sos{background:linear-gradient(135deg,#F24A4D,#C9161C);color:#fff;box-shadow:0 10px 24px rgba(229,56,59,.4)}
.btn.glass{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
.dsvc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.dsvc .s{font-size:12.5px;color:var(--text-2);margin-top:2px}

.fstrip .tag{font-family:'Caveat',cursive;font-size:24px;line-height:1.05;color:rgba(255,255,255,.85);max-width:170px;text-align:right}
.svc-d{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);gap:24px;align-items:start}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

@media (min-width:960px) and (max-width:1180px){
  .dsvc{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}

}
@media (max-width:959.98px){
  .d-only{display:none!important}
}
@media (min-width:960px){
  .m-only{display:none!important}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}

/* ---------- additions ---------- */
[hidden]{display:none!important}
a.btn{text-decoration:none}
svg.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-land{fill:var(--map-land)}.m-blk{fill:var(--map-block)}.m-park{fill:var(--map-park)}.m-tree{fill:var(--map-tree)}.m-water{fill:var(--map-water)}
.m-road{fill:none;stroke:var(--map-road);stroke-linecap:butt}.m-cas{fill:none;stroke:var(--map-casing);stroke-linecap:butt}
.m-lbl{fill:var(--map-label);font-family:var(--font);font-weight:700;paint-order:stroke;stroke:var(--map-halo);stroke-linejoin:round;letter-spacing:.07em}
.m-rl{font-weight:600;font-style:italic;letter-spacing:0}
.m-wl{fill:var(--blue);font-style:italic;font-weight:600;letter-spacing:0}
.map-sim{z-index:2}.map-live{z-index:2}
.act-card .card-h{padding:14px 16px 6px}
.act-card .row b{font-size:13.5px;white-space:nowrap;font-weight:800}
.dhero-p{margin-top:14px;color:rgba(255,255,255,.8);font-size:14.5px;max-width:430px;line-height:1.5}
.sos-note{font-size:12px;color:rgba(255,255,255,.55);text-align:center;margin-top:18px;max-width:380px}
.lnk{color:#fff;text-decoration:underline;font-weight:700;display:inline;font-size:inherit}
.btn.split{justify-content:flex-start}.btn.split .grow{flex:1;text-align:left}
.prog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:7px}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding:8px 18px 18px}
.kvs span{display:block;font-size:12px;color:var(--text-2);font-weight:600}
.kvs b{display:block;font-size:13.5px;margin-top:2px}
.trk-map{height:520px}
.cd-id{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.02em}
.cd-t{font-size:18px;font-weight:800;margin-top:2px;line-height:1.25}
.cd-desc{font-size:13.5px;color:var(--text-2)}
.ph-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
.tl .d .ic{width:11px;height:11px;stroke-width:3.2}
.inp-ic{position:relative}.inp-ic .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}.inp-ic .inp{padding-left:40px}
.inp.bad{border-color:var(--red)}
.route-note{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
.route-note .ic{color:var(--green)}.route-note b{color:var(--text)}
.pill.solid.on{background:var(--blue);border-color:var(--blue);color:#fff}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--text-2);background:var(--amber-soft);border:1px solid rgba(194,122,0,.22);border-radius:14px;padding:12px 14px;line-height:1.5}
.notice .ic{color:var(--amber);margin-top:2px}.notice b{color:var(--text)}
.about-hero{display:flex;align-items:center;gap:14px;background:var(--navy-900);color:#fff;border-radius:18px;padding:20px}
.about-hero svg{width:44px;height:52px;flex:none}.about-hero b{display:block;font-size:20px;font-weight:800;letter-spacing:.03em}.about-hero span{font-size:12px;color:rgba(255,255,255,.7)}
.step .n .ic{width:15px;height:15px}
.sheet-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.form-err{color:var(--red);font-size:12.5px;font-weight:600}.form-err:empty{display:none}
.ov .ov-note{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:18px}
.vid-note{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:rgba(255,255,255,.55);z-index:2;margin:0}
.vid .call-ctl{bottom:calc(34px + env(safe-area-inset-bottom,0px))}
.cd-ring{animation:cdring 3s linear forwards}
@keyframes cdring{to{stroke-dashoffset:var(--c)}}
.kpis.kpis-m{grid-template-columns:repeat(2,1fr);gap:10px}.kpis-m .kpi{padding:14px}.kpis-m .kpi .v{font-size:22px}
.sb-112 .ib{display:grid}.sb-112 b{display:block;color:#fff}.sb-112>span:last-child{display:block}
.drop.has{border-style:solid;min-height:190px}
.drop input.sr{position:absolute}
.lang .row .t{font-weight:600}
.cat .t,.cat .s{display:block}
.tb-loc{max-width:280px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ntf .row .when{padding-top:2px}
.cmp .row .t{overflow:hidden;text-overflow:ellipsis}
@media (max-width:959.98px){

}
@media (min-width:960px) and (max-width:1180px){ .tb-me-t{display:none} .tb-loc{max-width:200px} }
@media (min-width:960px){
  .sheet-btns{flex-direction:row}.sheet-btns .btn{flex:1}
  .dhero-art svg{position:absolute;inset:0}
}
.sidebar .nav-i{padding:9px 12px}
.sb-grp{padding:12px 12px 5px}
.sb-brand{padding-bottom:18px}
.sb-sos{margin-bottom:14px}
.sos-svc button:nth-child(2) .c,.sos-svc button:nth-child(3) .c{color:#FF5C5F}
.live-card .lc-in .chip{vertical-align:2px}
.photo.photo-d{border-radius:0;aspect-ratio:auto;height:300px}
.dpage .pick{flex-wrap:wrap}
@media (min-width:960px) and (max-height:960px){ .sb-tag{display:none} }

body.has-sheet .toasts{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
.vid-main::before{content:'';position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,rgba(6,16,41,.7),rgba(6,16,41,0));z-index:1;pointer-events:none}
.vid-main::after{content:'';position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(0deg,rgba(6,16,41,.75),rgba(6,16,41,0));z-index:1;pointer-events:none}
@media (min-width:960px){

  .vid-self{width:132px;height:176px;bottom:110px}
}
@media (min-width:960px) and (max-width:1180px){
  .dhero-art{width:46%}

  .dhero-in{max-width:420px;padding:30px 30px}
  .dhero-in h1{font-size:32px}
}

/* ---------- seeded random ---------- */
function rng(seed){ let s=seed>>>0; return function(){ s=(s+0x6d2b79f5)>>>0; let q=s; q=Math.imul(q^(q>>>15),q|1); q^=q+Math.imul(q^(q>>>7),q|61); return ((q^(q>>>14))>>>0)/4294967296; }; }
function f1(n){ return Math.round(n*10)/10; }

/* smooth closed blob through jittered ellipse points (Catmull-Rom -> cubic Bezier) */
function blob(cx,cy,rx,ry,n,jit,seed){
  const r=rng(seed), P=[];
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, j=1+(r()*2-1)*jit; P.push([cx+Math.cos(a)*rx*j, cy+Math.sin(a)*ry*j]); }
  let d='M'+f1(P[0][0])+' '+f1(P[0][1]);
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+='C'+f1(c1[0])+' '+f1(c1[1])+' '+f1(c2[0])+' '+f1(c2[1])+' '+f1(p2[0])+' '+f1(p2[1]);
  }
  return d+'Z';
}

function f2(n){ return Math.round(n*100)/100; }
function rclass(v,axis){ const A=axis==='x'?ART_X:ART_Y, B=axis==='x'?SEC_X:SEC_Y; return A.indexOf(v)>=0?'a':(B.indexOf(v)>=0?'s':'m'); }
function isPark(x0,y0){ for(let i=0;i<PARKS.length;i++){ if(PARKS[i][0]===x0&&PARKS[i][1]===y0) return true; } return false; }

/* base city map for a viewBox (units), k = units per px */
function baseMap(vb,k,avoid){
  let o='<rect class="m-land" x="'+f2(vb.x-5)+'" y="'+f2(vb.y-5)+'" width="'+f2(vb.w+10)+'" height="'+f2(vb.h+10)+'"/>';
  const gap=2.2*k, rx=f2(2.4*k);
  let blocks='', parks='';
  for(let i=0;i<MX.length-1;i++){
    const xa=MX[i], xb=MX[i+1];
    if(xb<vb.x-20||xa>vb.x+vb.w+20) continue;
    for(let j=0;j<MY.length-1;j++){
      const ya=MY[j], yb=MY[j+1];
      if(yb<vb.y-20||ya>vb.y+vb.h+20) continue;
      const L=xa+(RW[rclass(xa,'x')]/2)*k+gap, R=xb-(RW[rclass(xb,'x')]/2)*k-gap;
      const T=ya+(RW[rclass(ya,'y')]/2)*k+gap, B=yb-(RW[rclass(yb,'y')]/2)*k-gap;
      if(R-L<4||B-T<4) continue;
      if(isPark(xa,ya)){
        parks+='<rect class="m-park" x="'+f2(L)+'" y="'+f2(T)+'" width="'+f2(R-L)+'" height="'+f2(B-T)+'" rx="'+f2(5*k)+'"/>';
        const r=rng(i*131+j*17+5);
        for(let q=0;q<7;q++){ parks+='<circle class="m-tree" cx="'+f2(L+10*k+r()*(R-L-20*k))+'" cy="'+f2(T+10*k+r()*(B-T-20*k))+'" r="'+f2((4+r()*4)*k)+'"/>'; }
        continue;
      }
      const r=rng(i*977+j*131+3), q=r();
      const W=R-L, H=B-T, ag=2.6*k;
      if(q<0.38){ blocks+=rr(L,T,W,H,rx); }
      else if(q<0.78){
        if(W>=H){ const c=L+W*(0.35+r()*0.3); blocks+=rr(L,T,c-L-ag/2,H,rx)+rr(c+ag/2,T,R-c-ag/2,H,rx); }
        else { const c=T+H*(0.35+r()*0.3); blocks+=rr(L,T,W,c-T-ag/2,rx)+rr(L,c+ag/2,W,B-c-ag/2,rx); }
      } else {
        const cx=L+W*(0.4+r()*0.2), cy=T+H*(0.4+r()*0.2);
        blocks+=rr(L,T,cx-L-ag/2,cy-T-ag/2,rx)+rr(cx+ag/2,T,R-cx-ag/2,cy-T-ag/2,rx)+rr(L,cy+ag/2,cx-L-ag/2,B-cy-ag/2,rx)+rr(cx+ag/2,cy+ag/2,R-cx-ag/2,B-cy-ag/2,rx);
      }
    }
  }
  o+=parks+'<g class="m-blk">'+blocks+'</g>';
  const X0=-400,X1=1400,Y0=-300,Y1=1000;
  function lines(cls){ let d=''; MX.forEach(function(x){ if(rclass(x,'x')===cls) d+='M'+x+' '+Y0+'V'+Y1; }); MY.forEach(function(y){ if(rclass(y,'y')===cls) d+='M'+X0+' '+y+'H'+X1; }); return d; }
  o+='<path class="m-road" stroke-width="'+f2(RW.m*k)+'" d="'+lines('m')+'"/>';
  const ds=lines('s');
  o+='<path class="m-cas" stroke-width="'+f2((RW.s+2)*k)+'" d="'+ds+'"/><path class="m-road" stroke-width="'+f2(RW.s*k)+'" d="'+ds+'"/>';
  o+='<path class="m-water" d="'+blob(LAKE.cx,LAKE.cy,LAKE.rx,LAKE.ry,9,0.1,21)+'"/>';
  const da=lines('a');
  o+='<path class="m-cas" stroke-width="'+f2((RW.a+2.4)*k)+'" d="'+da+'"/><path class="m-road m-art" stroke-width="'+f2(RW.a*k)+'" d="'+da+'"/>';
  MLABELS.forEach(function(l){
    const fp=l.w?11:(l.r!=null?9.5:10), fs=f2(fp*k);
    const tw=l.t.length*fp*(l.w||l.r!=null?0.6:0.74)*k, th=fp*1.2*k;
    const hw=(l.r===1?th:tw)/2, hh=(l.r===1?tw:th)/2, m=6*k;
    if(l.x-hw<vb.x+m||l.x+hw>vb.x+vb.w-m||l.y-hh<vb.y+m||l.y+hh>vb.y+vb.h-m) return;
    if(avoid&&avoid.some(function(a){ return l.x+hw>a[0]-26*k&&l.x-hw<a[0]+26*k&&l.y+hh>a[1]-46*k&&l.y-hh<a[1]+14*k; })) return;
    const tr=l.r===1?' transform="rotate(-90 '+l.x+' '+l.y+')"':'';
    o+='<text class="m-lbl'+(l.w?' m-wl':'')+(l.r!=null?' m-rl':'')+'" x="'+l.x+'" y="'+l.y+'" font-size="'+fs+'" stroke-width="'+f2(3*k)+'" text-anchor="middle" dominant-baseline="middle"'+tr+'>'+esc(l.t)+'</text>';
  });
  return o;
}
function rr(x,y,w,h,rx){ if(w<2||h<2) return ''; return '<rect x="'+f2(x)+'" y="'+f2(y)+'" width="'+f2(w)+'" height="'+f2(h)+'" rx="'+rx+'"/>'; }

/* ---------- geometry ---------- */
function polyInfo(pts){ const cum=[0]; for(let i=1;i<pts.length;i++){ cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); } return {pts:pts, cum:cum, L:cum[cum.length-1]}; }
function pointAt(pi,d){
  const c=pi.cum, P=pi.pts; if(d<=0) return P[0].slice(); if(d>=pi.L) return P[P.length-1].slice();
  for(let i=1;i<c.length;i++){ if(d<=c[i]){ const u=(d-c[i-1])/(c[i]-c[i-1]||1); return [P[i-1][0]+(P[i][0]-P[i-1][0])*u, P[i-1][1]+(P[i][1]-P[i-1][1])*u]; } }
  return P[P.length-1].slice();
}

/* ---------- sims ---------- */
function ensureSim(key, force){
  const def=SIMDEF[key]; if(!def) return;
  const s=S.sims[key], now=performance.now();
  if(!s || force || (s.done && now-s.arrivedAt>4000)){
    S.sims[key]={start:now, dur:def.dur*1000, clock:Date.now(), done:false, arrivedAt:0};
  }
}
function simState(key){
  const s=S.sims[key], def=SIMDEF[key]; if(!s||!def) return null;
  let t=(performance.now()-s.start)/s.dur;
  if(def.loop) t=t-Math.floor(t);
  t=Math.max(0,Math.min(1,t));
  const p=def.loop?t:(0.3*t+0.7*t*t*(3-2*t));
  return {t:t, p:p, km:Math.max(0,Math.round(def.km*(1-p)*10)/10), eta:Math.max(1,Math.ceil(def.eta*(1-t))), done:!def.loop&&t>=1,
    arr:fmtTime(new Date(s.clock+def.eta*60000))};
}
function simActive(key){ const st=simState(key); return !!(st&&!st.done); }

/* ---------- map registry / mount ---------- */
const MAPREG={}, MOUNT={}; let MID=0, RO=null;
function mapHTML(cfg){
  const id='m'+(++MID); MAPREG[id]=cfg;
  return '<div class="map'+(cfg.cls?' '+cfg.cls:'')+'" data-mid="'+id+'" role="img" aria-label="'+esc(cfg.aria||'Live map')+'"'+(cfg.h?' style="height:'+cfg.h+'px"':'')+'>'+
    (cfg.live===false?'':'<span class="map-live"><i></i>LIVE</span>')+'<span class="map-sim">Simulated</span></div>';
}
function mapBBox(cfg){
  if(cfg.bbox) return cfg.bbox;
  let pts=[];
  (cfg.sims||[]).forEach(function(k){ const d=SIMDEF[k]; pts=pts.concat(d.route); pts.push(d.dest||USER_PT); });
  if(cfg.issue) pts.push(cfg.issue.pt);
  if(!pts.length) pts=[[USER_PT[0]-160,USER_PT[1]-120],[USER_PT[0]+160,USER_PT[1]+120]];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(function(p){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); });
  const m=cfg.margin!=null?cfg.margin:30;
  return [x0-m,y0-m,x1+m,y1+m];
}
function mountMaps(){
  for(const id in MAPREG){
    const el=document.querySelector('[data-mid="'+id+'"]');
    if(!el){ delete MAPREG[id]; delete MOUNT[id]; continue; }
    if(!MOUNT[id]||MOUNT[id].el!==el){ buildMap(id,el); if(RO) RO.observe(el); }
  }
}
if(typeof ResizeObserver!=='undefined'){
  RO=new ResizeObserver(function(ents){
    ents.forEach(function(en){
      const el=en.target, id=el.getAttribute('data-mid'), M=MOUNT[id]; if(!M||!MAPREG[id]) return;
      const w=el.clientWidth,h=el.clientHeight;
      if(Math.abs(w-(M.w||0))<2&&Math.abs(h-(M.h||0))<2) return;
      clearTimeout(M.to); M.to=setTimeout(function(){ if(MAPREG[id]&&document.body.contains(el)) buildMap(id,el); },90);
    });
  });
}
function buildMap(id,el){
  const cfg=MAPREG[id]; const w=el.clientWidth, h=el.clientHeight;
  const old=el.querySelector('svg.mapsvg'); if(old) old.remove();
  if(w<24||h<24){ MOUNT[id]={el:el,w:0,h:0,v:[]}; return; }
  const hasPill=cfg.pill!==false&&(cfg.sims||[]).length>0&&!cfg.incidents;
  const bb=mapBBox(cfg), pad=Object.assign({t:hasPill?66:34,r:22,b:26,l:22},cfg.pad||{});
  const bw=Math.max(bb[2]-bb[0],80), bh=Math.max(bb[3]-bb[1],80);
  const aw=Math.max(40,w-pad.l-pad.r), ah=Math.max(40,h-pad.t-pad.b);
  let s=Math.min(aw/bw, ah/bh); s=Math.min(s, cfg.maxScale||1.5);
  const k=1/s;
  const vb={w:w*k, h:h*k};
  vb.x=bb[0]-pad.l*k-(aw*k-bw)/2; vb.y=bb[1]-pad.t*k-(ah*k-bh)/2;
  const P=function(v){ return f2(v*k); };
  let o='<svg class="mapsvg" viewBox="'+f2(vb.x)+' '+f2(vb.y)+' '+f2(vb.w)+' '+f2(vb.h)+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  o+='<defs><filter id="sh'+id+'" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="'+P(1.6)+'" stdDeviation="'+P(2.4)+'" flood-color="#0A1A3F" flood-opacity=".32"/></filter></defs>';
  const avoid=[]; if(cfg.issue) avoid.push(cfg.issue.pt); else if(!cfg.incidents) avoid.push(USER_PT);
  o+=baseMap(vb,k,avoid);
  /* incidents (command centre) */
  if(cfg.incidents){
    INCIDENTS.forEach(function(n){
      const done=n.st==='Resolved';
      o+='<g transform="translate('+n.pt[0]+' '+n.pt[1]+')">'+(done?'':'<circle class="pulse" r="'+P(12)+'" fill="'+n.color+'" opacity=".4"/>')+
        '<circle r="'+P(8)+'" fill="'+(done?'#8793A8':n.color)+'" stroke="#fff" stroke-width="'+P(2.5)+'" filter="url(#sh'+id+')"/></g>';
    });
  }
  const sims=cfg.sims||[], vs=[];
  sims.forEach(function(key){
    const d=SIMDEF[key], pi=polyInfo(d.route), dp='M'+d.route.map(function(p){return p[0]+' '+p[1];}).join('L');
    const thin=!!cfg.incidents;
    o+='<path d="'+dp+'" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="'+P(thin?6:9)+'" stroke-linejoin="round" stroke-linecap="round"/>';
    o+='<path d="'+dp+'" fill="none" stroke="'+d.color+'" stroke-opacity=".28" stroke-width="'+P(thin?3.5:5)+'" stroke-linejoin="round" stroke-linecap="round"/>';
    o+='<path data-rem="'+key+'" d="'+dp+'" fill="none" stroke="'+d.color+'" stroke-width="'+P(thin?3.5:5)+'" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 0 '+f2(pi.L)+'"/>';
    if(!thin){
      const o0=d.route[0];
      o+='<g transform="translate('+o0[0]+' '+o0[1]+')"><rect x="'+P(-13)+'" y="'+P(-13)+'" width="'+P(26)+'" height="'+P(26)+'" rx="'+P(8)+'" fill="#fff" stroke="'+d.color+'" stroke-width="'+P(1.5)+'" filter="url(#sh'+id+')"/>'+
        '<g transform="scale('+f2(k*0.62)+') translate(-12 -12)" stroke="'+d.color+'" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+IC[d.origin.icon]+'</g></g>';
    }
    vs.push({key:key, pi:pi, thin:thin});
  });
  /* destination */
  if(cfg.issue){
    const ip=cfg.issue.pt, ok=cfg.issue.state==='resolved', col=ok?'#149452':'#E5383B';
    o+='<g transform="translate('+ip[0]+' '+ip[1]+')">'+(ok?'':'<circle class="pulse" r="'+P(14)+'" fill="'+col+'" opacity=".35"/>')+
      '<path d="M0 0C'+P(-2)+' '+P(-6)+' '+P(-12)+' '+P(-11)+' '+P(-12)+' '+P(-21)+'A'+P(12)+' '+P(12)+' 0 1 1 '+P(12)+' '+P(-21)+'C'+P(12)+' '+P(-11)+' '+P(2)+' '+P(-6)+' 0 0Z" fill="'+col+'" stroke="#fff" stroke-width="'+P(2)+'" filter="url(#sh'+id+')"/>'+
      '<g transform="translate(0 '+P(-21)+') scale('+f2(k*0.55)+') translate(-12 -12)" stroke="#fff" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+(ok?IC.check:IC.alert)+'</g></g>';
  } else if(!cfg.incidents){
    const up=USER_PT;
    o+='<g transform="translate('+up[0]+' '+up[1]+')"><circle class="pulse" r="'+P(14)+'" fill="#1F5BE0" opacity=".35"/>'+
      '<circle r="'+P(5)+'" fill="#1F5BE0" stroke="#fff" stroke-width="'+P(2)+'"/>'+
      '<path d="M0 '+P(-6)+'C'+P(-2)+' '+P(-11)+' '+P(-12)+' '+P(-16)+' '+P(-12)+' '+P(-26)+'A'+P(12)+' '+P(12)+' 0 1 1 '+P(12)+' '+P(-26)+'C'+P(12)+' '+P(-16)+' '+P(2)+' '+P(-11)+' 0 '+P(-6)+'Z" fill="#0F2250" stroke="#fff" stroke-width="'+P(2)+'" filter="url(#sh'+id+')"/>'+
      '<circle cy="'+P(-26)+'" r="'+P(4.4)+'" fill="#fff"/></g>';
  }
  /* vehicles (drawn last) */
  vs.forEach(function(v){
    const d=SIMDEF[v.key], R=v.thin?12:17;
    o+='<g data-veh="'+v.key+'"><circle r="'+P(R)+'" fill="'+d.color+'" stroke="#fff" stroke-width="'+P(v.thin?2.5:3)+'" filter="url(#sh'+id+')"/>'+
      '<g transform="scale('+f2(k*(v.thin?0.6:0.8))+') translate(-12 -12)" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[d.icon]+'</g></g>';
    if(cfg.pill!==false&&!v.thin){
      o+='<g data-pill="'+v.key+'"><rect rx="'+P(13)+'" height="'+P(26)+'" fill="'+d.pill+'" filter="url(#sh'+id+')"/><text font-size="'+P(12)+'" font-weight="700" fill="#fff" dominant-baseline="central" style="font-family:var(--font)"></text></g>';
    }
  });
  o+='</svg>';
  el.insertAdjacentHTML('afterbegin',o);
  const svg=el.querySelector('svg.mapsvg');
  const M={el:el, w:w, h:h, k:k, vb:vb, cfg:cfg, v:[]};
  vs.forEach(function(v){
    const g=svg.querySelector('[data-pill="'+v.key+'"]');
    M.v.push({key:v.key, pi:v.pi, veh:svg.querySelector('[data-veh="'+v.key+'"]'), rem:svg.querySelector('[data-rem="'+v.key+'"]'),
      pill:g, pr:g?g.querySelector('rect'):null, pt:g?g.querySelector('text'):null, lab:null, pw:0});
  });
  MOUNT[id]=M;
  drawMap(M,true);
}
function drawMap(M,force){
  M.v.forEach(function(v){
    const st=simState(v.key), d=SIMDEF[v.key];
    const p=st?st.p:0, dist=p*v.pi.L, pos=pointAt(v.pi,dist);
    v.veh.setAttribute('transform','translate('+f2(pos[0])+' '+f2(pos[1])+')');
    v.rem.setAttribute('stroke-dasharray','0 '+f2(dist)+' '+f2(v.pi.L+1));
    if(v.pill){
      const done=st&&st.done, lab=!st?d.label(d.km):(done?d.arrived:d.label(st.km));
      if(lab!==v.lab||force){
        v.lab=lab; v.pt.textContent=lab;
        v.pr.setAttribute('fill',done?'#149452':d.pill);
        let tw=0; try{ tw=v.pt.getComputedTextLength(); }catch{}
        if(!tw) tw=lab.length*6.6*M.k;
        v.pw=tw+22*M.k;
        v.pr.setAttribute('width',f2(v.pw));
      }
      const k=M.k, vb=M.vb, ph=26*k;
      let px=pos[0]-v.pw/2, py=pos[1]-24*k-ph;
      if(py<vb.y+36*k) py=pos[1]+24*k;
      px=Math.max(vb.x+8*k, Math.min(vb.x+vb.w-8*k-v.pw, px));
      v.pr.setAttribute('x',f2(px)); v.pr.setAttribute('y',f2(py));
      v.pt.setAttribute('x',f2(px+11*k)); v.pt.setAttribute('y',f2(py+ph/2));
    }
  });
}

/* ---------- live bindings ---------- */
function bindText(kind,key){
  const st=simState(key), d=SIMDEF[key];
  switch(kind){
    case 'eta': return !st?'—':(st.done?'Arrived':st.eta+' min');
    case 'km': return !st?'—':(st.done?'0 km':st.km+' km');
    case 'lab': return !st?d.label(d.km):(st.done?d.arrived:d.label(st.km));
    case 'arr': return !st?'—':st.arr;
    case 'st': return !st?'Not active · tap to track live':(st.done?'Arrived':'En route · '+st.km+' km away');
  }
  return '';
}
function updateBinds(root){
  (root||document).querySelectorAll('[data-bind]').forEach(function(el){
    const b=el.getAttribute('data-bind').split(':'), kind=b[0], key=b[1];
    if(kind==='bar'){ const st=simState(key); el.style.width=(st?(st.done?100:Math.round(st.p*100)):0)+'%'; return; }
    if(kind==='done'){ const st=simState(key); el.classList.toggle('done',!!(st&&st.done)); return; }
    const tx=bindText(kind,key); if(el.textContent!==tx) el.textContent=tx;
    if(kind==='eta'){ const st=simState(key); el.classList.toggle('done',!!(st&&st.done)); }
  });
}
let _lastBind=0;
function simTick(now){
  for(const id in MOUNT){ const M=MOUNT[id]; if(M.v&&M.v.length&&document.body.contains(M.el)) drawMap(M,false); }
  if(now-_lastBind>250){
    _lastBind=now;
    for(const key in S.sims){
      const s=S.sims[key], d=SIMDEF[key]; if(!s||!d||d.loop||s.done) continue;
      if(performance.now()-s.start>=s.dur){ s.done=true; s.arrivedAt=performance.now(); if(!d.quiet&&typeof onArrive==='function') onArrive(key); }
    }
    updateBinds();
  }
  requestAnimationFrame(simTick);
}

/* ---------- router ---------- */
function go(name, arg, opts){
  opts=opts||{};
  if(!PAGES[name]) name='home';
  if(opts.root) S.stack=[];
  else if(!opts.replace){ S.stack.push(S.route); if(S.stack.length>40) S.stack.shift(); }
  S.route={name:name, p:{key:arg, id:arg}};
  if(!opts.replace&&(!opts.root||HDEPTH===0)&&name!=='home') hPush();
  beforeRoute(name, S.route.p, opts);
  closeSheet(true);
  render(true);
}
function back(){
  if(S.stack.length){ S.route=S.stack.pop(); beforeRoute(S.route.name, S.route.p, {back:true}); render(true); }
  else if(S.route.name!=='home'){ S.route={name:'home', p:{}}; beforeRoute('home',{}, {}); render(true); }
}
/* phone / browser back button: mirror in-app navigation into history */
let HDEPTH=0;
function hPush(){ try{ history.pushState({cs:HDEPTH+1},''); HDEPTH++; }catch{} }
window.addEventListener('popstate',function(){
  if(HDEPTH>0) HDEPTH--;
  if($('#ovl').innerHTML){ if(OV.sos){ closeOv(); toast('SOS cancelled — nothing was sent','x','s-police'); } else closeOv(); hPush(); return; }
  if(SHEET){ closeSheet(); hPush(); return; }
  back();
});
function uiBack(){ if(HDEPTH>0){ try{ history.back(); return; }catch{} } back(); }
function beforeRoute(name, p, opts){
  if(name==='service'){ if(SKEYS.indexOf(p.key)<0) p.key='ambulance'; ensureSim(p.key); }
  else if(name==='home'&&DESK) ensureSim('ambulance');
  else if(name==='track'){ ensureSim('ambulance'); ensureSim('civic'); }
  else if(name==='command'){ ['cc1','cc2','cc3','cc4'].forEach(function(k){ ensureSim(k); }); }
  else if(name==='report'&&!opts.back) S.draft=newDraft(p.key);
  else if(name==='complaint'){ const c=findC(p.id); if(c&&(c.status==='progress'||c.status==='assigned')) ensureSim('crew'); S.cSel=p.id; }
  else if(name==='complaints'&&DESK){ const c=findC(S.cSel); if(c&&(c.status==='progress'||c.status==='assigned')) ensureSim('crew'); }
}

/* ---------- toasts ---------- */
function toast(msg, icon, tone){
  const box=$('#toasts'); if(!box) return;
  const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status');

}

  OV.call=setInterval(function(){
    const el=$(sel); if(!el){ clearInterval(OV.call); return; }
    if(!OV.callStart){ OV.callStart=Date.now(); }
    const s=Math.floor((Date.now()-OV.callStart)/1000);
    if(s<2){ return; }
    const q=s-2; el.textContent='Connected · '+(q/60<10?'0':'')+Math.floor(q/60)+':'+(q%60<10?'0':'')+(q%60);
  },500);
}
function videoStart(){
  const big=officerSVG().replace('<svg ','<svg preserveAspectRatio="xMidYMid slice" ');
  showOv('<div class="vid" role="dialog" aria-label="Video call"><div class="vid-main">'+big+'<div class="vid-top"><div><b>SI Ramesh Kumar</b><span id="vid-st">Connecting video…</span></div><span class="rec" style="position:static"><i></i>LIVE</span></div>'+
    '<div class="vid-self">'+esc(initials(S.user.name))+'</div></div>'+
    '<div class="call-ctl"><button data-act="call-tog" aria-pressed="false" aria-label="Mute">'+ic('micOff')+'</button><button class="end" data-act="ov-close" aria-label="End video call">'+ic('phoneOff')+'</button>'+
    '<button data-act="call-tog" aria-pressed="false" aria-label="Switch camera">'+ic('flip')+'</button></div><p class="vid-note">Simulated video call · prototype</p></div>');
  callTimer('#vid-st');
}

/* ---------- arrivals ---------- */
function onArrive(key){
  const d=SIMDEF[key]; if(!d||d.quiet) return;
  addNtf({kind:key==='civic'?'service':'emergency', svc:key, icon:TILE_IC[key], title:d.arrived, body:UNITS[key]+' reached '+shortArea()+'.'});
  if((key==='civic'&&S.prefs.service)||(key!=='civic'&&S.prefs.emergency)) toast(d.arrived, TILE_IC[key], 's-'+key);
}

/* ---------- complaints ---------- */
function submitReport(){
  const d=S.draft||newDraft('pothole'), k=catOf(d.cat);
  const loc=String(d.loc||'').trim();
  if(!loc){ const i=$('#f-loc'); if(i){ i.focus(); i.classList.add('bad'); } toast('Please add a location','alert','s-ambulance'); return; }
  const id='CS-'+(S.nextId++), when='Today, '+fmtTime(new Date());
  const title=String(d.title||'').trim()||(k.title+' – '+loc.split(',')[0]);
  const c={id:id, cat:k.key, title:title, loc:loc, status:'submitted', when:when, desc:String(d.desc||'').trim(), photo:d.photo,
    tl:[{t:'Complaint Submitted', s:when, st:'done'},{t:'Assigned to '+k.agency, s:'Usually within 1 hour', st:'cur'},{t:'Work in Progress', s:'Pending', st:'todo'}]};
  S.complaints.unshift(c); S.draft=null; S.cSel=id;
  if(S.prefs.complaint) addNtf({kind:'complaint', svc:'amber', icon:'clipboard', title:'Complaint Submitted', body:id+' · '+title, cid:id});
  toast('Complaint '+id+' submitted','check','s-civic');
  go('complaint', id, {replace:true});
  setTimeout(function(){
    if(c.status!=='submitted') return;
    c.status='progress';
    const tm='Today, '+fmtTime(new Date());
    c.tl=[{t:'Complaint Submitted', s:when, st:'done'},{t:'Assigned to '+k.agency, s:tm, st:'done'},{t:'Work in Progress', s:'Crew on the way · expected by Tomorrow, 10:00 AM', st:'cur'}];
    ensureSim('crew',true);
    if(S.prefs.complaint){ addNtf({kind:'complaint', svc:'amber', icon:'clipboard', title:'Complaint Update', body:id+' assigned to '+k.agency+'. A crew is on the way.', cid:id}); toast(id+' assigned to '+k.agency,'clipboard','s-amber'); }
    if(S.route.name==='complaint'||S.route.name==='complaints'||S.route.name==='mycomplaints') render(false);
  },5000);
}
function readPhoto(file){
  if(!file||!String(file.type).startsWith('image/')){ toast('Please choose an image file','alert','s-ambulance'); return; }
  const fr=new FileReader();
  fr.onload=function(){
    const img=new Image();
    img.onload=function(){
      const M=1280, sc=Math.min(1,M/Math.max(img.width,img.height)), cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      let url; try{ url=cv.toDataURL('image/jpeg',.82); }catch{ url=fr.result; }
      if(S.draft){ S.draft.photo=url; render(false); }
    };
    img.onerror=function(){ toast('Could not read that image','alert','s-ambulance'); };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- actions ---------- */
const ACT={
  back:function(){ uiBack(); },
  sos:function(){ sosStart(); },
  'sos-cancel':function(){ closeOv(); toast('SOS cancelled — nothing was sent','x','s-police'); },
  'sos-track':function(k){ closeOv(); go('service',k||'ambulance'); },
  'ov-close':function(){ closeOv(); },
  dispatch:function(k){
    ensureSim(k,true);
    addNtf({kind:'emergency', svc:k, icon:TILE_IC[k], title:SIMDEF[k].vehicle+' Dispatched', body:UNITS[k]+' is on the way to '+shortArea()+'.'});
    toast(SIMDEF[k].vehicle+' dispatched to your location', TILE_IC[k], 's-'+k);
    go('service',k);
  },
  dial:function(n){ openSheet(shDial(n),'dial'); },
  call:function(k){ callStart(k); },
  video:function(){ videoStart(); },
  'call-tog':function(a,el){ const on=el.getAttribute('aria-pressed')!=='true'; el.setAttribute('aria-pressed',String(on)); el.classList.toggle('on',on); },
  'share-loc':function(){ toast('Live location shared with SI Ramesh Kumar','nav','s-police'); },
  'share-live':function(a,el){ S.shareLive=!S.shareLive; el.setAttribute('aria-checked',String(S.shareLive)); toast(S.shareLive?'Live location sharing on':'Live location sharing off','nav','s-police'); },
  'loc-sheet':function(){ openSheet(shLoc(),'loc'); },
  'set-area':function(id){ const x=S.places.filter(function(q){return q.id===id;})[0]; if(!x) return; S.area=x.addr; closeSheet(true); render(false); toast('Location set to '+x.name,'pin','s-police'); },
  trip:function(k){ openSheet(shTrip(k),'trip'); },
  restart:function(k){ ensureSim(k,true); closeSheet(true); render(false); toast('Demo replayed','refresh','s-police'); },
  'hosp-sel':function(id){ S.hospital=id; const inSheet=!!SHEET; render(false); if(inSheet) openSheet(shHosp(),'hosp'); toast(hospName()+' set as destination','hospital','s-ambulance'); },
  'hosp-all':function(){ openSheet(shHosp(),'hosp'); },
  'view-map':function(k){ openSheet(shSvcMap(k),'map'); },
  'track-map':function(id){ const c=findC(id); if(c&&(c.status==='progress'||c.status==='assigned')) ensureSim('crew'); openSheet(shCmpMap(id),'cmap'); },
  'cmp-sel':function(id){ S.cSel=id; const c=findC(id); if(c&&(c.status==='progress'||c.status==='assigned')) ensureSim('crew'); render(false); },
  'cmp-filter':function(f){ S.cFilter=f; render(false); },
  'draft-cat':function(k){ if(!S.draft) S.draft=newDraft(k); S.draft.cat=k; render(false); },
  'draft-loc':function(){ if(!S.draft) return; S.draft.loc=S.area; const i=$('#f-loc'); if(i) i.value=S.area; toast('Location added from GPS (±12 m)','locate','s-police'); },
  'photo-rm':function(a,el,e){ e.preventDefault(); if(S.draft){ S.draft.photo=null; render(false); } },
  'report-submit':function(){ submitReport(); },
  'ntf-filter':function(f){ S.ntfFilter=f; render(false); },
  'ntf-read-all':function(){ S.notifications.forEach(function(n){ n.read=true; }); render(false); },
  'ntf-open':function(id){
    const n=S.notifications.filter(function(x){return x.id===id;})[0]; if(!n) return; n.read=true;
    if(n.cid&&findC(n.cid)) go('complaint',n.cid);
    else if(n.kind==='complaint') go('complaint','CS-2041');
    else if(SKEYS.indexOf(n.svc)>=0) go('service',n.svc);
    else render(false);
  },
  lang:function(c){ S.lang=c; applyLang(); render(false); toast(c==='en'?'Language: English':'Language changed','globe','s-police'); },
  pref:function(k,el){ S.prefs[k]=!S.prefs[k]; el.setAttribute('aria-checked',String(S.prefs[k])); },
  theme:function(v){ S.theme=v; applyTheme(); render(false); },
  'loc-access':function(){ openSheet(shLocAccess(),'la'); },
  'reset-demo':function(){ const d=seedState(); S.complaints=d.complaints; S.notifications=d.notifications; S.places=d.places; S.sims={}; S.nextId=2042; S.cSel=null; S.draft=null;
    S.area='Koramangala 5th Block, Bengaluru'; S.hospital='manipal'; S.user={name:'Shreyas Jayanna', first:'Shreyas', phone:'+91 90087 76208', city:'Bengaluru, Karnataka'};
    render(false); toast('Demo data restored','refresh','s-police'); },
  'place-tab':function(v){ S.placeTab=v; render(false); },
  'place-open':function(id){ openSheet(shPlace(id),'place'); },
  'place-add':function(){ openSheet(shAddPlace(),'addplace'); },
  ptype:function(v){ PLACE_TYPE=v; document.querySelectorAll('#p-type .pill').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-act')==='ptype:'+v); }); },
  'place-save':function(){
    const nm=($('#p-name')||{}).value||'', ad=($('#p-addr')||{}).value||'', er=$('#p-err');
    if(!nm.trim()||!ad.trim()){ if(er) er.textContent='Please enter a name and an address.'; return; }
    const icon={home:'home',work:'brief',frequent:'pin'}[PLACE_TYPE];
    S.places.push({id:'p'+Date.now(), name:nm.trim(), addr:ad.trim(), type:PLACE_TYPE, icon:icon});
    closeSheet(true); render(false); toast(nm.trim()+' saved','check','s-civic');
  },
  'place-del':function(id){ S.places=S.places.filter(function(x){return x.id!==id;}); closeSheet(true); render(false); toast('Place removed','bin','s-police'); },
  'place-share':function(id){ const x=S.places.filter(function(q){return q.id===id;})[0]; closeSheet(true); if(x) toast(x.name+' shared','send','s-police'); },
  'profile-edit':function(){ openSheet(shProfile(),'profile'); },
  'profile-save':function(){
    const nm=(($('#u-name')||{}).value||'').trim(), ph=(($('#u-phone')||{}).value||'').trim(), er=$('#u-err');
    if(nm.length<2){ if(er) er.textContent='Please enter your name.'; return; }
    if(!/^[+\d][\d\s-]{7,}$/.test(ph)){ if(er) er.textContent='Please enter a valid mobile number.'; return; }
    S.user.name=nm; S.user.first=nm.split(/\s+/)[0]; S.user.phone=ph; closeSheet(true); render(false); toast('Profile updated','check','s-civic');
  },
  feedback:function(){ toast('Thanks! Feedback is collected in the full version.','send','s-police'); },
  'sheet-close':function(){ closeSheet(); },
  'sheet-close-soft':function(){ setTimeout(function(){ closeSheet(true); },300); return true; }
};

document.addEventListener('click',function(e){
  if(e.target.closest('[data-scrim]')&&!e.target.closest('.sheet')){ closeSheet(); return; }
  const a=e.target.closest('[data-act]'), g=e.target.closest('[data-go]'), nv=e.target.closest('[data-nav]');
  const cands=[a,g,nv].filter(Boolean); if(!cands.length) return;
  let el=cands[0]; cands.forEach(function(c){ if(el.contains(c)&&el!==c) el=c; });
  if(el===a){
    const v=a.getAttribute('data-act'), i=v.indexOf(':'), name=i<0?v:v.slice(0,i), arg=i<0?null:v.slice(i+1);
    const fn=ACT[name]; if(!fn) return;
    const keepDefault=fn(arg,a,e);
    if(a.tagName==='A'&&keepDefault!==true) e.preventDefault();
    return;
  }
  const v=el.getAttribute(el===g?'data-go':'data-nav'), i=v.indexOf(':');
  go(i<0?v:v.slice(0,i), i<0?null:v.slice(i+1), {root:el===nv});
});
document.addEventListener('input',function(e){
  const f=e.target.getAttribute&&e.target.getAttribute('data-draft');
  if(f&&S.draft){ S.draft[f]=e.target.value; e.target.classList.remove('bad'); }
});
document.addEventListener('change',function(e){
  if(e.target.getAttribute&&e.target.getAttribute('data-inp')==='photo'&&e.target.files&&e.target.files[0]) readPhoto(e.target.files[0]);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if($('#ovl').innerHTML){ if(OV.sos){ closeOv(); toast('SOS cancelled — nothing was sent','x','s-police'); } else closeOv(); }
  else if(SHEET) closeSheet();
});
function onMQ(){ const d=MQ.matches; if(d===DESK) return; DESK=d; beforeRoute(S.route.name,S.route.p||{},{back:true}); closeSheet(true); render(false); }
if(MQ.addEventListener) MQ.addEventListener('change',onMQ); else if(MQ.addListener) MQ.addListener(onMQ);

function tickClock(){ const c=clockNow(); document.querySelectorAll('[data-clock]').forEach(function(el){ if(el.textContent!==c) el.textContent=c; }); }
setInterval(tickClock,1000);

/* ---------- boot ---------- */
applyTheme(); applyLang();
beforeRoute('home',{}, {});
render(true);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ Object.keys(MOUNT).forEach(function(id){ const M=MOUNT[id]; if(M&&M.v) M.v.forEach(function(v){ v.lab=null; }); }); });
