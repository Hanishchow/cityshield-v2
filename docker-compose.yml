# City Shield v2 server side: API + Postgres/PostGIS. The web app is served by
# GitHub Pages; the "web" profile can also serve it from this host if needed.
#   cp deploy/.env.example deploy/.env   # then fill secrets
#   docker compose --env-file deploy/.env up -d --build
# The API is published on API_BIND (default 127.0.0.1:8788); the optional web
# app (same origin as the API) on WEB_BIND (default 127.0.0.1:8789).
# RELEASE tags the images so deploy/ops.ps1 can roll back to a previous build.
name: cityshield2
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cityshield2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cityshield
      POSTGRES_USER: cityshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityshield -d cityshield"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: cityshield2-api:${RELEASE:-latest}
    container_name: cityshield2-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cityshield:${POSTGRES_PASSWORD}@db:5432/cityshield?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5178,http://localhost:4178}
      DEMO_MODE: ${DEMO_MODE:-true}
      SECONDS_PER_MINUTE: ${SECONDS_PER_MINUTE:-12}
      MAPPLS_CLIENT_ID: ${MAPPLS_CLIENT_ID:-}
      MAPPLS_CLIENT_SECRET: ${MAPPLS_CLIENT_SECRET:-}
      OLA_MAPS_API_KEY: ${OLA_MAPS_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_BIND:-127.0.0.1:8788}:8787"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://cityshield.live/}
        VITE_RELEASE: ${RELEASE:-local}
    image: cityshield2-web:${RELEASE:-latest}
    container_name: cityshield2-web
    # Off by default (the site is on GitHub Pages); WEB_ENABLED=true in .env turns it on.
    profiles: [web]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1:8789}:80"

  # Optional public HTTPS entry via Cloudflare Tunnel (outbound only, works
  # behind NAT), e.g. api.cityshield.live -> http://api:8787, set in the
  # Cloudflare dashboard. Enabled once CF_TUNNEL_TOKEN is in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cityshield2-cloudflared
    profiles: [cloudflare]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CF_TUNNEL_TOKEN:-}"]

  # Public HTTPS entry point for the API, kept online by Docker (restarts on
  # crash and on reboot). deploy.ps1 enables the "tunnel" profile once
  # NGROK_AUTHTOKEN and NGROK_DOMAIN (your free static domain) are in .env.
  tunnel:
    image: ngrok/ngrok:3
    container_name: cityshield2-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "api:8787", "--url=${NGROK_DOMAIN:-}", "--log=stdout"]

volumes:
  db:
  uploads:
